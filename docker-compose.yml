name: smart-grid-pipeline

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://smartgrid:smartgrid@postgres:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # The DAG must be active as soon as it is parsed: the tariff simulator
  # triggers it via the REST API, and runs of a paused DAG stay queued
  # forever. (`airflow dags unpause` in airflow-init runs before the DAG has
  # been parsed into the metadata DB, so it can't be relied on alone.)
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  # Shared across every Airflow container (webserver, scheduler, init).
  # Without an explicit value each container auto-generates its OWN random
  # secret key, and the webserver authenticates its internal log-fetch
  # requests to the scheduler's log server (port 8793) using this key --
  # mismatched keys across containers cause "403 Could not read served
  # logs" in the UI even though the task itself ran/failed normally.
  # Fine as a fixed demo value; a real deployment would inject this from a
  # secrets manager instead.
  AIRFLOW__WEBSERVER__SECRET_KEY: "smart-grid-mini-project-fixed-secret-key"
  PG_HOST: postgres
  PG_DB: smartgrid
  PG_USER: smartgrid
  PG_PASSWORD: smartgrid
  BATCH_DATA_DIR: /data/batch_incoming
  SPARK_MASTER_URL: spark://spark-master:7077

services:
  # ------------------------------------------------------------------ Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Belt-and-braces: whitelist ruok in case the healthcheck below is
      # ever changed back to a 4-letter-word probe. The healthcheck itself
      # no longer depends on this -- see the comment below.
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok, srvr, stat"
    healthcheck:
      # A plain TCP-port check rather than the classic "echo ruok | nc |
      # grep imok". The ruok 4-letter command is disabled by default from
      # ZooKeeper 3.5+ onward, and in testing the whitelist env var above
      # wasn't reliably taking effect against confluentinc/cp-zookeeper on
      # Docker Desktop -- only "srvr" showed as enabled regardless. `nc -z`
      # just checks the port accepts a connection, which needs no ZK-side
      # command to be enabled at all, so it can't be defeated the same way.
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 15

  # -------------------------------------------------------------- Postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartgrid
      POSTGRES_PASSWORD: smartgrid
      POSTGRES_DB: smartgrid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./docker/postgres/init-airflow-db.sql:/docker-entrypoint-initdb.d/00-airflow-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartgrid"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------- Spark
  spark-master:
    image: bitnamilegacy/spark:3.5.1
    environment:
      SPARK_MODE: master
    ports:
      - "8081:8080"   # Spark master UI
      - "7077:7077"

  spark-worker:
    image: bitnamilegacy/spark:3.5.1
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    # Executors of the Airflow-submitted batch job run here and read the raw
    # Parquet archive + tariff/weather CSVs directly from the shared volume.
    volumes:
      - sgdata:/data

  spark-streaming:
    build:
      context: .
      dockerfile: spark/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      METER_TOPIC: meter-readings
      RAW_ARCHIVE_DIR: /data/raw/meter_readings
      CHECKPOINT_DIR: /data/checkpoints/streaming_job
      LOW_RENEWABLE_THRESHOLD: ${LOW_RENEWABLE_THRESHOLD:-0.10}
      PG_HOST: postgres
      PG_DB: smartgrid
      PG_USER: smartgrid
      PG_PASSWORD: smartgrid
    volumes:
      - sgdata:/data
      - ./spark:/opt/spark_jobs
    command: >
      spark-submit
      --master local[2]
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3
      /opt/spark_jobs/streaming_job.py

  # --------------------------------------------------------------- Airflow
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate &&
          airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true &&
          airflow connections add spark_default --conn-type spark --conn-host spark://spark-master --conn-port 7077 || true &&
          airflow dags unpause smart_grid_batch_dag || true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - sgdata:/data
      - ./spark:/opt/spark_jobs

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - sgdata:/data
      - ./spark:/opt/spark_jobs
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - sgdata:/data
      - ./spark:/opt/spark_jobs
    command: scheduler

  # -------------------------------------------------------------- Serving
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_DB: smartgrid
      PG_USER: smartgrid
      PG_PASSWORD: smartgrid
      STALE_DATA_THRESHOLD_S: ${STALE_DATA_THRESHOLD_S:-90}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./dashboard:/app/dashboard

  # -------------------------------------------------------- Data sources
  meter-simulator:
    build:
      context: .
      dockerfile: sources/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      METER_TOPIC: meter-readings
      SIM_DAY_SECONDS: ${SIM_DAY_SECONDS:-300}
    # Shared volume holds sim_clock.json, the simulated-clock epoch both
    # simulators read so their sim_date labels agree.
    volumes:
      - sgdata:/data
    command: ["sources/meter_simulator.py"]

  tariff-simulator:
    build:
      context: .
      dockerfile: sources/Dockerfile
    depends_on:
      - airflow-webserver
    environment:
      SIM_DAY_SECONDS: ${SIM_DAY_SECONDS:-300}
      BATCH_DATA_DIR: /data/batch_incoming
      AIRFLOW_API_BASE: http://airflow-webserver:8080/api/v1
      AIRFLOW_USER: admin
      AIRFLOW_PASSWORD: admin
    volumes:
      - sgdata:/data
    command: ["sources/tariff_batch_source.py"]

volumes:
  pgdata:
  sgdata:
